<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Biblioteca de mods para Minecraft Java e outros jogos selecionados por Xexeu Dev."
    />
    <meta name="theme-color" content="#070604" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; upgrade-insecure-requests"
    />
    <title>Mods | Xexeu Dev</title>
    <link rel="icon" href="./assets/portal/brand-bird-v4-minimal.webp" />
    <link
      rel="preload"
      href="./assets/portal/portal-background.webp"
      as="image"
    />
    <link rel="stylesheet" href="./mods.css?v=3" />
  </head>
  <body>
    <div class="mods-backdrop" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <header class="mods-header">
      <div class="mods-header__marks">
        <a class="mods-home" href="./" aria-label="Voltar à página inicial">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-7 9 7"></path>
            <path d="M5.5 9.5V20h13V9.5"></path>
            <path d="M9.5 20v-6h5v6"></path>
          </svg>
        </a>

        <a class="mods-brand" href="./" aria-label="Xexeu Dev">
          <img
            src="./assets/portal/brand-bird-v4-minimal.webp"
            alt="Passarinho segurando uma chave inglesa"
            width="512"
            height="512"
          />
        </a>
      </div>

      <a class="mods-back" href="./" data-navigate>
        <span aria-hidden="true">←</span>
        <span>Voltar ao portal</span>
      </a>
    </header>

    <main class="mods-main">
      <header class="mods-intro">
        <p>Biblioteca modular</p>
        <h1>Escolha um universo</h1>
        <span>
          Cada moeda abre uma coleção diferente. Novos jogos serão liberados
          conforme os projetos ficarem prontos.
        </span>
        <i aria-hidden="true"></i>
      </header>

      <section class="coin-grid" aria-label="Jogos disponíveis">
        <a
          class="game-coin game-coin--minecraft is-ready"
          href="./modpacks-java.html"
          data-navigate
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Disponível</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--minecraft">
              <img
                src="./assets/mods-games/minecraft.png"
                alt=""
                width="320"
                height="320"
                decoding="async"
              />
            </span>
          </span>
          <strong>Minecraft Java</strong>
          <small>Abrir catálogo de mods</small>
        </a>

        <button
          class="game-coin game-coin--bedrock"
          type="button"
          data-coming-soon="A biblioteca de Minecraft Bedrock está sendo preparada."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--bedrock">
              <img
                src="./assets/mods-games/minecraft-bedrock.png"
                alt=""
                width="320"
                height="320"
                decoding="async"
              />
            </span>
          </span>
          <strong>Minecraft Bedrock</strong>
          <small>Add-ons e mundos</small>
        </button>

        <button
          class="game-coin game-coin--zomboid"
          type="button"
          data-coming-soon="Os mods de Project Zomboid estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--zomboid">
              <img
                src="./assets/mods-games/zomboid.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>Project Zomboid</strong>
          <small>Sobrevivência</small>
        </button>

        <button
          class="game-coin game-coin--roblox"
          type="button"
          data-coming-soon="Os projetos para Roblox estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--roblox">
              <img
                src="./assets/mods-games/roblox.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>Roblox</strong>
          <small>Experiências e scripts</small>
        </button>

        <button
          class="game-coin game-coin--skyrim"
          type="button"
          data-coming-soon="Os mods de Skyrim estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--skyrim">
              <img
                src="./assets/mods-games/skyrim.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>Skyrim</strong>
          <small>Aventuras e expansões</small>
        </button>

        <button
          class="game-coin game-coin--repo"
          type="button"
          data-coming-soon="Os mods de R.E.P.O. estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--repo">
              <img
                src="./assets/mods-games/repo.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>R.E.P.O.</strong>
          <small>Cooperação e terror</small>
        </button>

        <button
          class="game-coin game-coin--gta"
          type="button"
          data-coming-soon="Os mods de GTA V estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--gta">
              <img
                src="./assets/mods-games/gta-v.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>GTA V</strong>
          <small>Mundo aberto</small>
        </button>

        <button
          class="game-coin game-coin--sims"
          type="button"
          data-coming-soon="Os mods de The Sims estão sendo preparados."
        >
          <span class="coin-disc" aria-hidden="true">
            <span class="coin-status">Em breve</span>
            <span class="coin-orbit"></span>
            <span class="coin-symbol coin-symbol--sims">
              <img
                src="./assets/mods-games/the-sims.png"
                alt=""
                width="320"
                height="320"
                loading="lazy"
                decoding="async"
              />
            </span>
          </span>
          <strong>The Sims</strong>
          <small>Vida e construção</small>
        </button>
      </section>

      <p class="mods-footnote">
        <span aria-hidden="true">◆</span>
        Selecione uma moeda para continuar
      </p>
    </main>

    <div class="mods-toast" data-toast aria-hidden="true" role="status">
      <span aria-hidden="true">!</span>
      <p data-toast-message></p>
    </div>

    <script src="./mods.js?v=1"></script>
  </body>
</html>
